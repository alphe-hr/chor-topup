<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chor TopUp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="topup-card">
        <h2>Chor TopUp Store</h2>
        <form>
            <label for="player-id">Player ID:</label>
            <input type="text" id="player-id" placeholder="Enter your Game ID" required>

            <label for="diamonds">Select Diamonds:</label>
            <select id="diamonds">
                <option value="100">100 Diamonds - 80 BDT</option>
                <option value="520">520 Diamonds - 380 BDT</option>
                <option value="1060">1060 Diamonds - 750 BDT</option>
            </select>

            <label for="payment">Payment Method:</label>
            <select id="payment">
                <option value="bkash">bKash</option>
                <option value="nagad">Nagad</option>
            </select>

            <button type="submit">Order Now</button>
        </form>
    </div>
</body>
</html>
